name: economical-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_docker:
        description: Build the CPU service image and check health endpoints
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned uv and Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked CPU test dependencies
        run: uv sync --locked --group service --extra cpu
      - name: Lint the repository
        run: uv run --locked --no-sync ruff check .
      - name: Run only the synthetic contract tests
        run: |
          test ! -e data
          test ! -e artifacts
          uv run --locked --no-sync python -m pytest -q \
            tests/test_bundle_loader.py \
            tests/test_bundle_runtime.py \
            tests/test_session_protocol.py \
            tests/test_raw_session_runner.py \
            tests/test_raw_session_cli.py \
            tests/test_http_service.py \
            tests/test_service_sessions.py \
            tests/test_ci_contract.py
      - name: Build the exact-revision runtime wheel
        run: uv build --wheel --out-dir dist
      - name: Verify the packaged identity and schemas
        run: >-
          uv run --locked --no-sync python scripts/check_wheel.py
          --wheel dist/sleep_classifier-0.1.0-py3-none-any.whl
          --expected-revision "$(git rev-parse HEAD)"
      - name: Build the optional CPU service image
        if: github.event_name == 'workflow_dispatch' && inputs.check_docker
        run: docker build --tag sleep-classifier:ci .
      - name: Check container health without a bundle
        if: github.event_name == 'workflow_dispatch' && inputs.check_docker
        run: |
          docker run --detach --name sleep-ci --read-only \
            --tmpfs /tmp --publish 127.0.0.1:8000:8000 sleep-classifier:ci
          trap 'docker logs sleep-ci; docker rm --force sleep-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/readyz)" = 503
