prepare_config: prepare.yaml
output_dir: ../artifacts/fixed-lag-motion-single
model_type: patch_transformer
seed: 42
epochs: 40
batch_size: 64
context_epochs: 30
learning_rate: 0.001
patience: 12
gradient_clip: 1.0
device: auto
transformer:
  d_model: 16
  nhead: 2
  num_layers: 1
  feedforward_dim: 32
  dropout: 0.2
  max_context: 30
diagnostics:
  enabled: true
  save_predictions: true
  evaluate_training: true
  checkpoint_epochs:
  - 13
  - 14
  - 15
  - 16
  - 17
  high_confidence_threshold: 0.8
patch_size: 3
window_features:
  name: heart_rate_deviation
  history_epochs: 10
  min_history_epochs: 4
motion_features:
  name: fixed_lag_motion
  audit_config: motion-grid-audit.yaml
