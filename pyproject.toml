[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleep-classifier"
version = "0.1.0"
description = "Causal wearable sleep staging experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "ipython>=9.17.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0", "nbconvert>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
